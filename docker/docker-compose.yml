services:
  lynx:
    image: fooololo/lynx:${APP_VERSION:-latest}
    container_name: lynx
    restart: unless-stopped
    network_mode: bridge
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3003:3456"
    environment:
      NODE_ENV: production
      PORT: "3456"
      DB_PATH: /app/data/lynx.db
      TZ: Asia/Shanghai
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      NODE_OPTIONS: "--max-old-space-size=512"
      # neodata 代理（金价查询需要）
      AUTH_GATEWAY_PORT: "19000"
      # 安全要求：JWT_SECRET / AUTH_PASSWORD 必须通过 docker/.env 提供（该文件已被 .gitignore 忽略）。
      # 生成方式：openssl rand -base64 48
      # 注意：更换 JWT_SECRET 会使所有已签发的登录 token 失效，需要重新登录。
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required - put it in docker/.env, e.g. openssl rand -base64 48}
      AUTH_USERNAME: ${AUTH_USERNAME:-admin}
      AUTH_PASSWORD: ${AUTH_PASSWORD:?AUTH_PASSWORD is required - put it in docker/.env (change the default admin123)}
    volumes:
      # 持久化 SQLite 数据库
      - ../data:/app/data:rw
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3456/api/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
